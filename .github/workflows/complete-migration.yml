name: Complete Wix migration assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install crawler dependency
        run: pip install lxml
      - name: Capture current Wix content
        run: python crawl_site.py
      - name: Download Wix image assets
        run: python fetch_assets.py
      - name: Generate package lock
        run: npm install --package-lock-only
      - name: Commit generated migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-content.json asset-map.json package-lock.json public/media
          git diff --cached --quiet && exit 0
          git commit -m "Complete Wix content and image asset migration"
          git push
