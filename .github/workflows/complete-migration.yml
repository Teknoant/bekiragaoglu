name: Complete Wix migration assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install crawler dependency
        run: pip install lxml
      - name: Capture current Wix content
        run: python crawl_site.py
      - name: Download Wix image assets
        run: python fetch_assets.py
      - name: Discover and download Wix homepage video
        run: |
          python - <<'PY'
          import re, urllib.request, pathlib, html
          req=urllib.request.Request('https://www.bekiragaoglusigorta.com.tr/',headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          raw=html.unescape(raw).replace('\\u002F','/').replace('\\/','/')
          urls=[]
          for pat in [r'https://video\.wixstatic\.com/[^"\'<> ]+',r'https://static\.wixstatic\.com/[^"\'<> ]+\.mp4[^"\'<> ]*']:
            urls += re.findall(pat,raw)
          urls=[u.rstrip('\\,}]') for u in urls if '.mp4' in u]
          print('video candidates',len(urls))
          for i,u in enumerate(dict.fromkeys(urls)):
            try:
              data=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
              if len(data)>100000:
                p=pathlib.Path('public/media/home-advisory.mp4'); p.write_bytes(data); print('saved',u,len(data)); break
            except Exception as e: print('skip',u,e)
          PY
      - name: Generate package lock
        run: npm install --package-lock-only
      - name: Commit generated migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-content.json asset-map.json package-lock.json public/media
          git diff --cached --quiet && exit 0
          git commit -m "Complete Wix content and image asset migration"
          git push
